[workspace]
members = ["crates/protocol", "crates/server", "crates/runner", "crates/desktop-updater"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.25"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
ferry-protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
