<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Connection settings</title>

  </head>
  <body>
    <header class="connection-toolbar"><div id="connection-controls"></div></header>
    <main class="connection-shell">
    <section class="connection-card">
    <div class="connection-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M11 6.5h6M11 17.5h6"/></svg></div>
    <h1 id="connection-title">连接服务</h1>
    <p id="connection-help">留空则使用本机随应用一起安装的服务。</p>
    <select id="connection-language" hidden aria-label="Language"><option value="zh-CN">简体中文</option><option value="en-US">English</option><option value="ms-MY">Bahasa Melayu</option><option value="zh-TW">繁體中文</option><option value="ja-JP">日本語</option><option value="ko-KR">한국어</option></select>
    <div class="connection-fields">
    <label id="url-label" for="url">服务地址</label>
    <input id="url" type="url" autocomplete="url" autocapitalize="none" spellcheck="false" placeholder="http://127.0.0.1:4290" />
    <button id="open">打开工作空间</button>
    <p id="connection-error" role="alert"></p>
    </div>
    </section>
    <section class="updates" aria-labelledby="update-title" hidden>
      <div class="update-heading"><h2 id="update-title">应用更新</h2><a id="release-page" hidden target="_blank" rel="noopener noreferrer">GitHub 发布页 ↗</a></div>
      <p id="version">正在读取当前版本…</p>
      <button id="check-update">检查更新</button>
      <button id="install-update" hidden>下载并安装更新</button>
      <p id="update-status" role="status" aria-live="polite"></p>
      <progress id="update-progress" hidden aria-label="更新下载进度"></progress>
      <pre id="update-notes" hidden></pre>
    </section>
    </main>
    <script type="module" src="../../src/native/connection-controls.tsx"></script>
  </body>
</html>
