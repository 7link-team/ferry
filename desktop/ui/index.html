<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Ferry · 连接设置</title>
    <style>
      body { font: 14px/1.6 system-ui, "PingFang SC", sans-serif; margin: 0; padding: 28px;
             background: #0f1115; color: #e6e9ee; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p { color: #98a2b3; margin: 0 0 20px; }
      label { display: block; margin-bottom: 6px; }
      input { width: 100%; padding: 9px 10px; border: 1px solid #262c36; border-radius: 6px;
              background: #161a21; color: inherit; }
      button:disabled { opacity: .5; cursor: wait; }
      button:focus-visible, input:focus-visible { outline: 2px solid #8ec5ff; outline-offset: 3px; }
      .updates { margin-top: 32px; padding-top: 20px; border-top: 1px solid #262c36; }
      .updates p { margin: 10px 0; }
      progress { width: 100%; }
      pre { white-space: pre-wrap; max-height: 100px; overflow: auto; color: #b9c3d4; }
      button { margin-top: 16px; padding: 9px 18px; border: 0; border-radius: 6px;
               background: #4f9cf9; color: #06121f; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>连接 Ferry 服务</h1>
    <p>留空则使用本机随应用一起安装的服务。</p>
    <label for="url">服务地址</label>
    <input id="url" placeholder="http://127.0.0.1:4290" />
    <button id="open">打开工作空间</button>
    <section class="updates" aria-labelledby="update-title">
      <h2 id="update-title">应用更新</h2>
      <p id="version">正在读取当前版本…</p>
      <button id="check-update">检查更新</button>
      <button id="install-update" hidden>下载并安装更新</button>
      <p id="update-status" role="status" aria-live="polite"></p>
      <progress id="update-progress" hidden aria-label="更新下载进度"></progress>
      <pre id="update-notes" hidden></pre>
    </section>
    <p id="connection-error" role="alert"></p>
    <script type="module" src="launcher.js"></script>
  </body>
</html>
