services:
  ferry:
    # Overridable so a fork or an internal registry needs no edit here.
    image: ${FERRY_IMAGE:-ghcr.io/7link-team/ferry-server:latest}
    # Only used by `docker compose build`; `up` pulls the image above.
    build: { context: ., target: runtime }
    restart: unless-stopped
    ports:
      - "4290:4290"
    environment:
      # Leave empty for the bundled SQLite; set for PostgreSQL.
      FERRY_DATABASE_URL: ${FERRY_DATABASE_URL:-}
      # The address runners and browsers reach this server on.
      FERRY_PUBLIC_URL: ${FERRY_PUBLIC_URL:-http://localhost:4290}
      FERRY_ALLOWED_HOSTS: ${FERRY_ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - ferry-data:/data

volumes:
  ferry-data:
