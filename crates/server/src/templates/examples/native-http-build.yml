# Run on your own Linux host with Bash and Python 3. No third-party packages.
# The matching Native application template expects the executable artifact app.
name: Native HTTP artifact build
on: workflow_dispatch
jobs:
  build:
    name: Build Native HTTP service
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Create and check the executable
        shell: bash
        run: |
          set -eu
          command -v python3
          cat > app <<'PY'
          #!/usr/bin/env python3
          import http.server
          import os

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path not in ("/", "/health"):
                      self.send_error(404)
                      return
                  body = ("ok" if self.path == "/health" else os.environ["WELCOME_MESSAGE"]).encode("utf-8")
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain; charset=utf-8")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

          if __name__ == "__main__":
              http.server.ThreadingHTTPServer(("0.0.0.0", int(os.environ["PORT"])), Handler).serve_forever()
          PY
          chmod 755 app
          python3 -m py_compile app
          printf 'BUILT_JOB=%s ARTIFACT=app\n' "$GITHUB_JOB"
      - name: Archive the executable
        uses: actions/upload-artifact@v4
        with:
          name: native-http
          path: app
