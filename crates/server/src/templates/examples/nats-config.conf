server_name: $NATS_SERVER_NAME
port: 4222
http_port: 8222
client_advertise: $NATS_CLIENT_ADVERTISE
authorization {
  token: $NATS_AUTH_TOKEN
}
jetstream {
  store_dir: /data
}
cluster {
  name: example-nats
  listen: 0.0.0.0:6222
  routes: [nats://nats-a:6222, nats://nats-b:6222, nats://nats-c:6222]
}
