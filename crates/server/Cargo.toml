[package]
name = "ferry-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferry-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
chrono.workspace = true
uuid.workspace = true

axum = { version = "0.8", features = ["ws", "multipart"] }
tower-http = { version = "0.6", features = ["trace", "limit", "set-header"] }
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "sqlx-postgres", "sqlx-mysql", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "sqlx-postgres", "sqlx-mysql", "runtime-tokio-rustls"] }
# MySQL 8 negotiates caching_sha2_password with RSA on a first non-TLS connection.
sqlx = { version = "0.9", default-features = false, features = ["mysql-rsa"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
rust-embed = { version = "8", features = ["debug-embed"] }
mime_guess = "2"
fs2 = "0.4"
bytes = "1"
futures = "0.3"
async-trait = "0.1"
russh = "0.64"
russh-sftp = "3"
