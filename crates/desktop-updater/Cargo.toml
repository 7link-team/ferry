[package]
name = "ferry-desktop-updater"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
minisign-verify = "0.3"
semver = "1"
sha2 = "0.10"
tempfile = "3"
tokio.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }

[build-dependencies]
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Globalization"] }
