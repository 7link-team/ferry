[package]
name = "ferry-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferry-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
uuid.workspace = true
tempfile = "3"
rquickjs = { version = "0.14.0", default-features = false, features = ["std"] }
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize"] }
wasmi = "0.40"
base64 = "0.22"

[dev-dependencies]
wat = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
