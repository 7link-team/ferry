[package]
name = "ferry-runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferry-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
tempfile = "3"
base64 = "0.22"
minisign-verify = "0.3"
sha2 = "0.10"
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }

tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
# Blocking pty, wrapped in dedicated threads: the only cross-platform option
# that speaks ConPTY on Windows as well as a unix pty.
portable-pty = "0.9"
# Load, memory and disk without three per-OS parsers in this crate.
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network"] }
local-ip-address = "0.6.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[build-dependencies]
serde_json.workspace = true
