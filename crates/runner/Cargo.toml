[package]
name = "ferry-runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferry-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true

tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
# Blocking pty, wrapped in dedicated threads: the only cross-platform option
# that speaks ConPTY on Windows as well as a unix pty.
portable-pty = "0.9"
# Load, memory and disk without three per-OS parsers in this crate.
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
