name: Inspect alpha2 backend failure
on:
  push:
    branches: [feat/020-alpha2-storage-diagnostic]
    paths: [.github/workflows/alpha2-ci-failure.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {data:job}=await github.rest.actions.getJobForWorkflowRun({...context.repo,job_id:126412324149});
            if(job.head_sha!=='f15d214d350f18a79c6201fdd4610dcb2b9957f0' || job.conclusion!=='failure')throw Error('Unexpected job');
            const response=await github.rest.actions.downloadJobLogsForWorkflowRun({...context.repo,job_id:job.id});
            const text=typeof response.data==='string'?response.data:Buffer.from(response.data).toString('utf8');
            const lines=text.split('\n');
            const start=lines.findIndex(line=>line.includes('##[group]Run cp target/debug/ferry-server'));
            const excerpt=(start>=0?lines.slice(start):lines.slice(-120)).join('\n');
            core.error(excerpt.slice(-12000));
