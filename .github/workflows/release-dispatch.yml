name: Build and publish verified alpha36
on:
  push:
    branches: [feat/alpha36-release-dispatch]
    paths: [.github/workflows/release-dispatch.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const sha='9e3d33187483903070bcafe38e58ce60ce9c3b5a';
            const tag='v0.1.0-alpha.36';
            const repo=context.repo;
            async function requireMain() {
              const {data}=await github.rest.repos.getCommit({...repo,ref:'main'});
              if(data.sha!==sha)throw Error('Main changed; refusing publication');
            }
            async function runs(workflow,event) {
              return (await github.rest.actions.listWorkflowRuns({...repo,workflow_id:workflow,event,head_sha:sha})).data.workflow_runs;
            }
            async function waitFor(workflow,event) {
              for(let attempt=0;attempt<900;attempt++) {
                const matching=await runs(workflow,event);
                if(matching.length>1)throw Error('Ambiguous source runs '+workflow);
                const run=matching[0];
                if(run) {
                  if(run.head_sha!==sha || run.head_branch!=='main')throw Error('Unexpected source');
                  if(attempt%6===0)core.info(`${workflow} ${run.id}: ${run.status}`);
                  if(run.status==='completed') {
                    if(run.conclusion!=='success')throw Error(`Required ${workflow} ${run.id} ${run.conclusion}`);
                    return run;
                  }
                }
                await new Promise(resolve=>setTimeout(resolve,10000));
              }
              throw Error('Timed out; inspect existing run before retry');
            }
            await requireMain();
            if((await runs('build.yml','workflow_dispatch')).length)throw Error('Build already dispatched; inspect first');
            for(const run of await runs('build.yml','push')) {
              if(run.status!=='completed')await github.rest.actions.cancelWorkflowRun({...repo,run_id:run.id});
            }
            await github.rest.actions.createWorkflowDispatch({...repo,workflow_id:'build.yml',ref:'main'});
            const build=await waitFor('build.yml','workflow_dispatch');
            const image=await waitFor('server-image.yml','push');
            core.notice(`Verified build ${build.id} and source image ${image.id}`);
            await requireMain();
            if((await runs('publish-verified.yml','workflow_dispatch')).length)throw Error('Already published/dispatched; inspect first');
            const notes = "\u4ee3\u7801\u7ed3\u6784\u4e0e\u53ef\u7ef4\u62a4\u6027\u6cbb\u7406\uff0c\u72ec\u7acb\u4e8e alpha.35 \u529f\u80fd\u7248\u672c\u4ea4\u4ed8\u3002\n\n- \u524d\u7aef\u6309 app\u3001features\u3001shared \u5206\u5c42\uff0c\u4e1a\u52a1\u914d\u7f6e\u5206\u522b\u5f52\u5c5e\u5bf9\u5e94\u6a21\u5757\uff1b\u7edf\u4e00\u516c\u5171\u8868\u5355\u3001\u8868\u683c\u3001API\u3001\u4e3b\u9898\u4e0e\u7f16\u8f91\u5668\u57fa\u7840\u8bbe\u65bd\u3002\n- \u62c6\u5206\u90e8\u7f72\u6e05\u5355\u7f16\u8f91\u5668\u548c\u9875\u9762\u7ec4\u5408\u804c\u8d23\uff0c\u4fdd\u7559 YAML \u6ce8\u91ca\u3001\u672a\u77e5\u5b57\u6bb5\u3001\u7c7b\u578b\u4e0e\u6e90\u7801\u7f16\u8f91\u80fd\u529b\uff0c\u4ee5\u53ca Monaco \u548c\u7ec8\u7aef\u61d2\u52a0\u8f7d\u3002\n- \u670d\u52a1\u7aef\u6309\u8d26\u6237\u3001\u4e3b\u673a\u3001\u6d41\u6c34\u7ebf\u3001\u4ed3\u5e93\u3001\u90e8\u7f72\u3001\u7ef4\u62a4\u3001\u901a\u77e5\u53ca\u8d44\u6e90\u7ec4\u7ec7\u6a21\u5757\uff1b\u62c6\u5206 Runner \u8fde\u63a5/\u5347\u7ea7\u3001Actions \u6267\u884c\u7f16\u6392\u53ca\u4ed3\u5e93\u6388\u6743\u5927\u6587\u4ef6\u3002\n- \u4fdd\u7559\u73b0\u6709 Cargo crate \u8fb9\u754c\u3001HTTP \u8def\u7531\u3001\u6570\u636e\u5e93\u7ed3\u6784\u548c\u534f\u8bae\uff1b\u66f4\u65b0\u811a\u672c\u53ca CI \u7684\u6e90\u7801\u8def\u5f84\u4e0e\u6d4b\u8bd5\u7b5b\u9009\uff0c\u5e76\u9632\u6b62\u7b5b\u9009\u4e3a\u7a7a\u65f6\u8bef\u62a5\u6210\u529f\u3002\n- \u65b0\u589e\u524d\u7aef\u5c42\u7ea7\u4e0e\u5faa\u73af\u4f9d\u8d56\u68c0\u6d4b\uff0c\u66f4\u65b0\u5f00\u53d1\u76ee\u5f55\u8bf4\u660e\uff1b\u4fee\u6b63\u6d4f\u89c8\u5668\u6d4b\u8bd5\u7684 Windows \u76ee\u5f55\u4e0e shell \u517c\u5bb9\u6027\u3002\n\n\u672c\u7248\u672c\u4e3a alpha \u9884\u53d1\u5e03\u3002\u7ed3\u6784\u6cbb\u7406\u4e0d\u6539\u53d8 alpha.35 \u7684\u4ea7\u54c1\u884c\u4e3a\uff1b\u53d7\u652f\u6301\u5e73\u53f0\u7684\u771f\u5b9e\u6388\u6743\u4e0e\u7f51\u7edc\u73af\u5883\u9a8c\u8bc1\u8fb9\u754c\u6cbf\u7528 alpha.35 \u8bf4\u660e\u3002";
            await github.rest.actions.createWorkflowDispatch({...repo,workflow_id:'publish-verified.yml',ref:'main',inputs:{run_id:String(build.id),title:tag,notes}});
            const publication=await waitFor('publish-verified.yml','workflow_dispatch');
            const {data:release}=await github.rest.repos.getReleaseByTag({...repo,tag});
            if(release.draft || !release.prerelease)throw Error('Unexpected release state');
            core.notice(`Published ${tag}: ${publication.id}`);
            await github.rest.actions.createWorkflowDispatch({...repo,workflow_id:'server-image.yml',ref:'main',inputs:{release_tag:tag}});
            const versioned=await waitFor('server-image.yml','workflow_dispatch');
            core.notice(`Versioned image: ${versioned.id}`);
