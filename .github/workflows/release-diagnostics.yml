name: Alpha2 failed image diagnostics
on:
  push:
    branches: [feat/release-030-alpha2-diagnose-1]
    paths: [.github/workflows/release-diagnostics.yml]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            for(const job_id of [127841743786,127841743551]) {
              const response=await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs',{...context.repo,job_id});
              const log=typeof response.data==='string'?response.data:Buffer.from(response.data).toString('utf8');
              const lines=log.split('\n');
              const indices=lines.map((line,i)=>/FAILED|panicked at|error\[|error:/.test(line)?i:-1).filter(i=>i>=0);
              for(const index of indices.slice(-12))core.error(`Job ${job_id}:\n`+lines.slice(Math.max(0,index-4),index+8).join('\n'));
              core.error(`Job ${job_id} tail:\n`+lines.slice(-75).join('\n').slice(-16000));
            }
