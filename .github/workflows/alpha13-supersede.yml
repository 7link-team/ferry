name: Supersede alpha13 release candidate
on:
  push:
    branches: [ci/release-alpha13-supersede-20261110]
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const targets = [[42668524898, "46284b35bab4dfa173231ccbba5d8300c45577e3", "main", "Build and release"], [42668642990, "46284b35bab4dfa173231ccbba5d8300c45577e3", "v0.3.0-alpha.13", "Build and release"], [42668525046, "46284b35bab4dfa173231ccbba5d8300c45577e3", "main", "Server container"], [42668642393, "46284b35bab4dfa173231ccbba5d8300c45577e3", "v0.3.0-alpha.13", "Server container"], [42670678798, "731274e4ecb7de0857ed7abf98367af77ccef3ae", "v0.3.0-alpha.14", "Build and release"], [42670678760, "731274e4ecb7de0857ed7abf98367af77ccef3ae", "v0.3.0-alpha.14", "Server container"]];
            for (const [run_id, sha, branch, name] of targets) {
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo,run_id});
              if(run.head_sha !== sha || run.head_branch !== branch || run.name !== name) throw Error('Source mismatch '+run_id);
              core.info(`${run_id}: ${run.status}/${run.conclusion}`);
              if(run.status !== 'completed') await github.rest.actions.cancelWorkflowRun({...context.repo,run_id});
            }

