name: Container sandbox acceptance
on:
  push:
    branches: [main]
    paths:
      - sandbox-seccomp.json
      - sandbox-seccomp.LICENSE
      - compose.yaml
      - compose.production.yaml
      - scripts/quickstart.sh
      - scripts/test-quickstart.sh
      - scripts/test-workflow-sandbox.py
      - Dockerfile
      - Cargo.toml
      - Cargo.lock
      - crates/protocol/src/sandbox.rs
      - crates/protocol/src/resources.rs
      - crates/sandbox/**
      - .github/scripts/test-sandbox-container.py
      - .github/scripts/smoke-server-image.mjs
      - .github/workflows/sandbox-container.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      IMAGE: ferry-server:sandbox-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install and upgrade script regression
        run: sh scripts/test-quickstart.sh
      # The protocol and test driver must come from the same revision. Testing
      # main's driver against the previous release's latest image mixes contracts.
      - uses: docker/setup-buildx-action@v3
      - name: Build the current revision without publishing an image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,scope=server-${{ matrix.arch }},mode=max
      - name: Test the candidate non-root image with the deployment policy
        shell: bash
        run: |
          mkdir -p harness-logs
          set +e
          python3 .github/scripts/test-sandbox-container.py "$IMAGE" 2>&1 | tee harness-logs/sandbox.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then python3 .github/scripts/annotate-failures.py harness-logs/sandbox.log || true; fi
          exit "$status"
      - name: Verify expression workflow creation and execution through the API
        shell: bash
        run: |
          set +e
          node .github/scripts/smoke-server-image.mjs "$IMAGE" 2>&1 | tee harness-logs/workflow.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then python3 .github/scripts/annotate-failures.py harness-logs/workflow.log || true; fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-container-${{ matrix.runner }}
          path: harness-logs/
