name: Alpha2 storage stop diagnostics
on:
  push:
    branches: [feat/020-alpha2-storage-diagnostic]
    paths: [.github/workflows/alpha2-storage-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Add stop-state diagnostics without changing assertions
        shell: python
        run: |
          from pathlib import Path
          p=Path('scripts/test-compose-storage.py')
          text=p.read_text()
          needle='exec "$STORAGE_TEST_DOCKER" "$@"'
          addition='''if [ "$1" = ps ] && [ "$2" = -q ] && [ "$3" = --filter ]; then
            consumers=$("$STORAGE_TEST_DOCKER" "$@") || exit $?
            if [ -n "$consumers" ]; then
              printf 'STOP DIAGNOSTIC %s\\n' "$*" >&2
              "$STORAGE_TEST_DOCKER" inspect --format '{{.Id}} {{.State.Status}} running={{.State.Running}} restarting={{.State.Restarting}} finished={{.State.FinishedAt}}' $consumers >&2
            fi
            printf '%s\\n' "$consumers"
            exit 0
          fi
          '''
          assert text.count(needle)==1
          p.write_text(text.replace(needle,addition+needle))
      - name: Real PostgreSQL migration, interruption and relocation
        run: python3 .github/scripts/annotate-failures.py --run python3 scripts/test-compose-storage.py postgres
