name: Pipeline editing validation

on:
  workflow_dispatch:
  push:
    branches: ["feat/**"]
    paths:
      - ".github/workflows/pipeline-editing.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "workers/actions/**"
      - "scripts/build-actions-workers.sh"
      - "scripts/test-*.mjs"
      - "scripts/test-actions-execution.py"
      - "scripts/test-repository-auth.py"
      - "scripts/test-pipeline-classification.py"
      - "scripts/test-pipelines.py"
      - "scripts/test-pipelines.sh"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"

permissions:
  contents: read

concurrency:
  group: pipeline-editing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connections-and-pipelines:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-only-password
          MYSQL_DATABASE: ferry
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pintegration-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: ferry
        ports: ["5432:5432"]
        options: >-
          --health-cmd=pg_isready --health-interval=10s
          --health-timeout=5s --health-retries=12
    env:
      FERRY_REQUIRE_ALL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: workers/actions/go.mod
          cache-dependency-path: workers/actions/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: pipeline-editing
          cache-on-failure: true
      - name: Install live pipeline harness dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc lsof openssh-client python3 git curl libdigest-sha-perl
          docker info
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/build-actions-workers.sh
      - id: backend
        run: cargo build --locked -p ferry-server -p ferry-runner
      - if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: cargo test --locked -p ferry-server
      - name: Pipeline and connection browser acceptance
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: |
          result=0
          for suite in actions-canvas named-connection-ui repository-auth-ui actions-ui marketplace-ui; do
            node "scripts/test-$suite.mjs" || result=1
          done
          exit "$result"
      - name: Code connections and repository authorization on all three databases
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        env:
          MYSQL_PWD: integration-only-password
          PGPASSWORD: integration-only-password
        run: |
          mysql -h 127.0.0.1 -u root -e 'CREATE DATABASE oauth_test;'
          createdb -h 127.0.0.1 -U postgres oauth_test
          python3 -I scripts/test-repository-auth.py
          FERRY_TEST_DATABASE_URL=mysql://root:integration-only-password@127.0.0.1:3306/oauth_test python3 -I scripts/test-repository-auth.py
          FERRY_TEST_DATABASE_URL=postgres://postgres:integration-only-password@127.0.0.1:5432/oauth_test python3 -I scripts/test-repository-auth.py
      - name: Pipeline classification and environment snapshots
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: python3 -I scripts/test-pipeline-classification.py
      - name: Live Actions pipeline execution
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        env:
          FERRY_TEST_ACTIONS: "1"
        run: |
          mkdir -p harness-logs
          python3 -I scripts/test-pipelines.py 2>&1 | tee harness-logs/pipelines.log
      - name: Transfer and marketplace compatibility
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-venv"
          "$RUNNER_TEMP/transfer-venv/bin/pip" install openpyxl==3.1.5
          "$RUNNER_TEMP/transfer-venv/bin/python" -I scripts/test-transfers.py
          python3 -I scripts/test-marketplace.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-editing-${{ github.run_attempt }}
          path: harness-logs/*
          if-no-files-found: ignore
