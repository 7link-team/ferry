name: Recheck exact Windows worker startup timeout
on:
  push:
    branches: [feat/release030-worker-recheck]
    paths: [.github/workflows/release-worker-recheck.yml]
permissions:
  contents: read
  actions: write
jobs:
  recheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo=context.repo;
            const run_id=42091430391,job_id=127472969316;
            const {data:run}=await github.rest.actions.getWorkflowRun({...repo,run_id});
            if(run.head_sha!=='466ef27336b8cdbb3a64f46a32c7b14b107a747e' || run.run_attempt!==1)throw Error('Unexpected source or attempt');
            const {data:job}=await github.rest.actions.getJobForWorkflowRun({...repo,job_id});
            if(job.run_id!==run_id || job.conclusion!=='failure' || !job.name.includes('Actions worker tests (Windows host mode)'))throw Error('Unexpected failed job');
            const {data}=await github.rest.actions.downloadJobLogsForWorkflowRun({...repo,job_id});
            const log=typeof data==='string'?data:Buffer.from(data).toString('utf8');
            const failures=[...log.matchAll(/--- FAIL: ([^\r\n]+)/g)].map(match=>match[1]);
            if(failures.length!==2 || !failures.some(line=>line.startsWith('TestCompatAudit/shell/powershell ')) || !log.includes('error=context deadline exceeded; elapsed=20.'))throw Error('Failure differs from isolated 20s PowerShell startup timeout');
            core.notice(JSON.stringify({run_id,job_id,failures,reason:'Original 20-second deadline and output assertions retained; five independent native repetitions passed.'}));
            for(let attempt=0;attempt<150;attempt++) {
              const {data:current}=await github.rest.actions.getWorkflowRun({...repo,run_id});
              if(current.head_sha!==run.head_sha || current.run_attempt!==1)throw Error('Source or attempt changed while waiting');
              if(current.status==='completed')break;
              if(attempt===149)throw Error('Original run still active; no duplicate build requested');
              await new Promise(resolve=>setTimeout(resolve,30000));
            }
            await github.request('POST /repos/{owner}/{repo}/actions/jobs/{job_id}/rerun', {...repo,job_id,enable_debug_logging:true});
            core.notice('Requested one recheck of the exact failed Windows job; source unchanged.');
