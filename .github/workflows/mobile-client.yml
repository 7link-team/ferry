name: Mobile client builds

on:
  workflow_call:
    secrets:
      MOBILE_ANDROID_KEYSTORE_BASE64:
        required: false
      MOBILE_ANDROID_STORE_PASSWORD:
        required: false
      MOBILE_ANDROID_KEY_ALIAS:
        required: false
      MOBILE_ANDROID_KEY_PASSWORD:
        required: false
  workflow_dispatch:
  push:
    # Validate native-input changes on main before an immutable release tag.
    branches: ["main", "feat/**"]
    paths:
      - "desktop/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-client.yml"
      - ".github/scripts/test-ios-client.mjs"
      - ".github/scripts/ios-client-*.swift"
      - ".github/scripts/mobile-gradle.init.gradle"
      - ".github/scripts/mobile-release.py"
      - ".github/scripts/test-mobile-release.py"
  pull_request:
    paths:
      - "desktop/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-client.yml"
      - ".github/scripts/test-ios-client.mjs"
      - ".github/scripts/ios-client-*.swift"
      - ".github/scripts/mobile-gradle.init.gradle"
      - ".github/scripts/mobile-release.py"
      - ".github/scripts/test-mobile-release.py"

permissions:
  contents: read

concurrency:
  # Keep reusable release builds separate from standalone mobile checks.
  group: mobile-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            package-lock.json
            desktop/mobile-prepare.mjs
            desktop/Cargo.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: mobile-android
          cache-on-failure: true
      - name: Check release version binding
        run: python3 .github/scripts/mobile-release.py version
      - run: npm ci
      - name: Verify native icons match the Web brand master
        env:
          NATIVE_ICON_DIAGNOSTICS_DIR: build-artifacts/mobile-android/native-icons
        run: npm run brand:icons:check
      - name: Launcher and navigation regressions
        run: npx vitest run --config desktop/vitest.config.js
      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Generate native project from official templates
        working-directory: desktop
        run: |
          npx tauri android init --ci --skip-targets-install
          node mobile-prepare.mjs
          node ../scripts/export-native-icons.mjs --sync android
      - name: Configure official Maven Central alternative
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cp .github/scripts/mobile-gradle.init.gradle "$HOME/.gradle/init.d/mobile-repositories.gradle"
      - name: Build signed release APKs
        working-directory: desktop
        env:
          GRADLE_OPTS: -Dorg.gradle.logging.level=info
          MOBILE_ANDROID_KEYSTORE_BASE64: ${{ secrets.MOBILE_ANDROID_KEYSTORE_BASE64 }}
          MOBILE_ANDROID_STORE_PASSWORD: ${{ secrets.MOBILE_ANDROID_STORE_PASSWORD }}
          MOBILE_ANDROID_KEY_ALIAS: ${{ secrets.MOBILE_ANDROID_KEY_ALIAS }}
          MOBILE_ANDROID_KEY_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$MOBILE_ANDROID_KEYSTORE_BASE64$MOBILE_ANDROID_STORE_PASSWORD$MOBILE_ANDROID_KEY_ALIAS$MOBILE_ANDROID_KEY_PASSWORD" ]; then
            test -n "$MOBILE_ANDROID_KEYSTORE_BASE64" && test -n "$MOBILE_ANDROID_STORE_PASSWORD" && test -n "$MOBILE_ANDROID_KEY_ALIAS" && test -n "$MOBILE_ANDROID_KEY_PASSWORD" || { echo "::error::All four mobile signing secrets must be configured together"; exit 1; }
            export MOBILE_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/mobile-update.keystore"
            trap 'rm -f "$MOBILE_ANDROID_KEYSTORE_PATH"' EXIT
            umask 077
            printf '%s' "$MOBILE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$MOBILE_ANDROID_KEYSTORE_PATH"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Tagged releases require the persistent Android signing secrets"; exit 1
          else
            echo "::warning::No persistent Android signing key configured; acceptance APKs use the debug key and cannot update installed releases."
          fi
          mkdir -p ../build-artifacts/mobile-android
          npx tauri android build --target aarch64 x86_64 --apk --split-per-abi --ci 2>&1 | tee ../build-artifacts/mobile-android/build.log
      - name: Preserve failed Android build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-client-build-diagnostics
          if-no-files-found: warn
          path: build-artifacts/mobile-android/
      - name: Verify and stage versioned release APKs
        env:
          # Public fingerprint of the persistent release certificate; a tag fails on any other signer.
          MOBILE_ANDROID_CERT_SHA256: ${{ secrets.MOBILE_ANDROID_KEYSTORE_BASE64 != '' && '7d:fd:8b:48:44:cc:4e:a9:66:28:af:69:e0:4e:81:56:df:5b:1c:d7:a6:b5:ac:22:41:e5:53:91:b6:d2:65:2c' || '' }}
        run: python3 .github/scripts/mobile-release.py android --output release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: android-client-apks
          if-no-files-found: error
          path: release-assets/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-mobile-android
          if-no-files-found: error
          path: release-assets/*

  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: mobile-ios
          cache-on-failure: true
      - name: Check release version binding
        run: python3 .github/scripts/mobile-release.py version
      - run: npm ci
      - name: Verify native icons match the Web brand master
        env:
          NATIVE_ICON_DIAGNOSTICS_DIR: build-artifacts/mobile-ios/native-icons
        run: npm run brand:icons:check
      - name: Install Xcode project generator
        run: command -v xcodegen || brew install xcodegen
      - name: Generate native project from official templates
        working-directory: desktop
        run: |
          npx tauri ios init --ci --skip-targets-install
          node ../scripts/export-native-icons.mjs --sync ios
      - name: Build simulator client
        working-directory: desktop
        run: npx tauri ios build --debug --target aarch64-sim --no-sign --ci
      - name: Exercise native iPhone client flows
        run: |
          set -eu
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device_id" || test "$(xcrun simctl list devices -j | python3 -c 'import json,sys; print(next(d["state"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["udid"] == sys.argv[1]))' "$device_id")" = Booted
          xcrun simctl bootstatus "$device_id" -b
          app=$(find desktop/gen/apple/build/arm64-sim -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          mkdir -p build-artifacts/mobile-ios
          ditto -c -k --sequesterRsrc --keepParent "$app" build-artifacts/mobile-ios/simulator-client.app.zip
          node .github/scripts/test-ios-client.mjs --udid "$device_id" --app-path "$app"
      - name: Build unsigned device IPA
        working-directory: desktop
        run: npx tauri ios build --target aarch64 --no-sign --ci
      - name: Verify and stage versioned unsigned iOS packages
        run: python3 .github/scripts/mobile-release.py ios --output release-assets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-client-simulator-and-unsigned-device
          if-no-files-found: warn
          path: |
            build-artifacts/mobile-ios/
            release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-mobile-ios
          if-no-files-found: error
          path: release-assets/*
