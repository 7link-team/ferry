name: Application deployment acceptance

on:
  workflow_dispatch:
  push:
    branches: [main, 'ci/e2e-remediation-*', 'ci/scenario-templates-*']
    paths:
      - .github/workflows/deployment-ha.yml
      - scripts/test-deployments.py
      - scripts/nats_application_acceptance.py
      - scripts/redis_application_acceptance.py
      - scripts/test-deployments.sh
      - scripts/test-deployments-ui.mjs
      - src/**
      - crates/server/src/deployments/**
      - crates/server/src/migration.rs
      - crates/server/src/migration/**
      - crates/server/src/hosts.rs
      - crates/server/src/hosts/**
      - crates/server/src/notifications/**
      - crates/server/src/templates.rs
      - crates/server/src/templates/**
      - crates/server/src/blueprint/**
      - marketplace/**
      - crates/server/src/i18n/repository-*.json
      - crates/runner/**
      - crates/protocol/**
  pull_request:
    paths:
      - .github/workflows/deployment-ha.yml
      - scripts/test-deployments.py
      - scripts/nats_application_acceptance.py
      - scripts/redis_application_acceptance.py
      - scripts/test-deployments.sh
      - scripts/test-deployments-ui.mjs
      - src/**
      - crates/server/src/deployments/**
      - crates/server/src/migration.rs
      - crates/server/src/migration/**
      - crates/server/src/hosts.rs
      - crates/server/src/hosts/**
      - crates/server/src/notifications/**
      - crates/server/src/templates.rs
      - crates/server/src/templates/**
      - crates/server/src/blueprint/**
      - marketplace/**
      - crates/server/src/i18n/repository-*.json
      - crates/runner/**
      - crates/protocol/**

permissions:
  contents: read

concurrency:
  group: deployment-ha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-acceptance:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: native
            swarm_ha: "0"
            label: Native artifact and systemd SSH and Agent acceptance
          - mode: docker
            swarm_ha: "0"
            label: Docker application example acceptance
          - mode: compose
            swarm_ha: "0"
            label: Compose deployment and browser acceptance
          - mode: stack
            swarm_ha: "1"
            label: Three-node Swarm failure recovery
          - mode: docker
            swarm_ha: "0"
            blueprint: "1"
            label: blueprint
          - mode: stack
            swarm_ha: "1"
            blueprint: "1"
            label: blueprint on three-node Swarm
    env:
      FERRY_REQUIRE_ALL: "1"
      FERRY_TEST_DEPLOY_MODE: ${{ matrix.mode }}
      FERRY_TEST_SWARM_HA: ${{ matrix.swarm_ha }}
      FERRY_TEST_BLUEPRINT: ${{ matrix.blueprint || '0' }}
      FERRY_TEST_SCENARIO_TEMPLATES: "1"
      FERRY_TEST_NATS_TEMPLATES: "1"
      FERRY_TEST_REDIS_TEMPLATES: "1"
      FERRY_TEST_OUTPUT_DIR: ${{ github.workspace }}/harness-logs/fixtures
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        if: matrix.mode == 'native'
        with:
          go-version-file: workers/actions/go.mod
          cache-dependency-path: workers/actions/go.sum
      - name: Build the Linux Actions worker for artifact pipelines
        if: matrix.mode == 'native'
        env:
          ACTIONS_WORKER_TARGETS: linux/amd64
        run: bash scripts/build-actions-workers.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
          save-if: false
      - name: Verify the isolated Docker test environment
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client python3 git curl
          docker info
          # Reuse the runner's Compose v2 plugin explicitly. Copy this exact
          # binary into the owned SSH/Agent fixture; record version and SHA256.
          compose_path=$(docker info --format '{{json .ClientInfo.Plugins}}' | python3 -c 'import json,sys; print(next(p["Path"] for p in json.load(sys.stdin) if p["Name"] == "compose"))')
          test -x "$compose_path"
          echo "FERRY_TEST_COMPOSE_BINARY=$compose_path" >> "$GITHUB_ENV"
          "$compose_path" version --short
          mkdir -p "$FERRY_TEST_OUTPUT_DIR"
      - run: npm ci
      - name: Install the HA protocol acceptance clients
        if: matrix.mode == 'compose' || matrix.mode == 'stack'
        run: |
          python3 -m venv "$RUNNER_TEMP/nats-client-env"
          "$RUNNER_TEMP/nats-client-env/bin/python" -m pip install nats-py==2.9.0 redis==5.2.1
          "$RUNNER_TEMP/nats-client-env/bin/python" -I -c 'import nats, redis'
          echo "$RUNNER_TEMP/nats-client-env/bin" >> "$GITHUB_PATH"
      - name: Install the deployment browser
        if: matrix.mode == 'compose'
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: cargo fmt --all -- --check
      - name: Build server and HostAgent
        run: |
          cargo build --locked -p ferry-server -p ferry-runner
          cargo test --locked -p ferry-server templates::tests:: -- --nocapture
      - name: Full server regression on Linux
        if: matrix.mode == 'native'
        run: |
          mkdir -p harness-logs
          python3 .github/scripts/annotate-failures.py --run cargo test --locked -p ferry-server -- --nocapture 2>&1 | tee harness-logs/server-tests.log
      - name: Deployment acceptance through SSH and HostAgent
        shell: bash
        run: |
          set -euo pipefail
          # The harness owns every fixture. Stack mode owns three nested Docker
          # daemons; it never initializes Swarm on the host or targets user machines.
          if bash scripts/test-deployments.sh 2>&1 | tee harness-logs/acceptance.log; then
            exit 0
          else
            python3 .github/scripts/annotate-failures.py harness-logs/acceptance.log
            exit 1
          fi
      - name: Application template selection and marketplace compatibility
        if: matrix.mode == 'compose'
        env:
          FERRY_SCENARIO_UI_OUTPUT: ${{ github.workspace }}/harness-logs/template-ui
        run: node scripts/test-marketplace-ui.mjs
      - name: Record the tested boundary
        if: always()
        run: |
          {
            echo '### ${{ matrix.label }}'
            echo "Commit: $GITHUB_SHA; run: $GITHUB_RUN_ID"
            if [ "$FERRY_TEST_BLUEPRINT" = 1 ] && [ "$FERRY_TEST_DEPLOY_MODE" = stack ]; then
              echo 'Official nats-cluster and nginx-ha blueprints created from ferry/deploy-v1 specs with host-tag selectors, stack driver through SSH on a three-node Swarm (manager plus two workers, one Ferry host per node): placement equals the tagged hosts, NATS members as node-pinned host-mode services (routes, JetStream meta cluster and R3 stream), Nginx web and balancer as replicated ingress services constrained by workspace-scoped tag labels synchronized on apply (load balancing over the web VIP, parameter upgrade through the spec, rollback).'
              echo 'Swarm nodes are nested daemons sharing one kernel; does not certify physical-host HA or manager quorum.'
            elif [ "$FERRY_TEST_BLUEPRINT" = 1 ]; then
              echo 'Official nats-cluster and nginx-ha blueprints through SSH and HostAgent: Docker driver on three fixture hosts with independent daemons, created from ferry/deploy-v1 specs with host-tag selectors (placement equals the tagged hosts and the placement preview, routes, JetStream meta cluster and R3 stream, load balancing, parameter upgrade through the spec, rollback, frozen placement) and Compose on one host from an explicit binding.'
              echo 'Fixture hosts share one kernel; does not certify physical-host HA. Native blueprints are covered by Rust compile tests only.'
            elif [ "$FERRY_TEST_DEPLOY_MODE" = native ]; then
              echo 'Initialized Actions build and Native application templates: real archive, SSH and HostAgent systemd deployment, HTTP, readiness and rollback regression.'
              echo 'Isolated Linux fixture shares the runner kernel; does not certify physical host HA or cross-host migration.'
            elif [ "$FERRY_TEST_DEPLOY_MODE" = docker ]; then
              echo 'Real Docker deployment through SSH and HostAgent using the initialized HTTP application template.'
            elif [ "$FERRY_TEST_DEPLOY_MODE" = compose ]; then
              echo 'Real Compose deployment through SSH and HostAgent, including browser acceptance.'
            else
              echo 'One manager and two workers, each with an isolated Docker daemon.'
              echo 'Covers placement, replica distribution, task replacement, worker outage/rejoin, rolling update, rollback and unsatisfied constraints.'
              echo 'Shares one host kernel; does not certify physical-host isolation, manager quorum, database HA or volume migration.'
            fi
            if [ "$FERRY_TEST_BLUEPRINT" != 1 ] && { [ "$FERRY_TEST_DEPLOY_MODE" = compose ] || [ "$FERRY_TEST_DEPLOY_MODE" = stack ]; }; then
              echo 'Initialized NATS application through SSH and HostAgent: three persistent members, token authentication, client discovery, leader loss, durable consumer recovery and quorum refusal/restoration.'
              echo 'Initialized Redis Sentinel application through SSH and HostAgent: six authenticated members, asynchronous replication, majority failover, old-master demotion, persisted dynamic roles and Sentinel quorum loss/restoration.'
              echo 'Sentinel results do not certify RPO=0, full-outage recovery or network-partition fencing.'
              echo 'Stack members use distinct assigned daemons and local volumes; no physical three-host, TLS, route authentication or volume migration certification.'
            fi
            echo 'See acceptance.json and daemon logs for actual results.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-${{ matrix.mode }}${{ matrix.blueprint == '1' && '-blueprint' || '' }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            harness-logs/acceptance.log
            harness-logs/server-tests.log
            harness-logs/fixtures/**/acceptance.json
            harness-logs/fixtures/**/*.log
            harness-logs/template-ui/*.png
