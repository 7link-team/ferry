name: Database monitor acceptance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/database-monitor.yml
      - crates/server/src/platform_monitor.rs
      - crates/server/src/platform_monitor/database.rs
      - scripts/test-platform.py
      - scripts/test-database-monitor-ui.mjs
      - src/app/PlatformMonitor.tsx
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  database-monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-only-password
          MYSQL_DATABASE: platform_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pintegration-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd=pg_isready --health-interval=10s
          --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: backends
      - run: npm ci
      - run: npm run build
      - run: cargo build --locked -p ferry-server
      - name: SQLite platform and metadata
        run: python3 .github/scripts/annotate-failures.py --run python3 -I scripts/test-platform.py
      - name: MySQL platform and metadata
        env:
          FERRY_TEST_DATABASE_URL: mysql://root:integration-only-password@127.0.0.1:3306/platform_test
        run: python3 .github/scripts/annotate-failures.py --run python3 -I scripts/test-platform.py
      - name: PostgreSQL platform and metadata
        if: ${{ !cancelled() }}
        env:
          FERRY_TEST_DATABASE_URL: postgres://postgres:integration-only-password@127.0.0.1:5432/platform_test
        run: python3 .github/scripts/annotate-failures.py --run python3 -I scripts/test-platform.py
      - name: Install Chromium
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium
      - name: Shared database list in Chromium
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/annotate-failures.py --run node scripts/test-database-monitor-ui.mjs
