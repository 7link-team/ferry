name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Releases must not be cancelled half way through uploading their assets.
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: workers/actions/go.mod
          cache-dependency-path: workers/actions/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop -> target
      # desktop/ is a Tauri crate, so even `cargo check` needs the GTK/WebKit
      # headers its dependencies link against.
      - name: Install the desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Test Actions worker
        working-directory: workers/actions
        run: bash go.sh test -race ./...
      - run: node --test .github/scripts/check-updater-manifest.mjs .github/scripts/check-runner-manifest.mjs
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --locked
      - name: Check the desktop workspace
        run: |
          # tauri-build reads bundle.externalBin, and the sidecar is a build
          # output that a checkout does not carry, so give the check an empty
          # stand-in for the host triple.
          mkdir -p desktop/binaries
          touch "desktop/binaries/ferry-server-$(rustc -vV | sed -n 's/^host: //p')"
          cd desktop
          cargo check --locked
          cargo test --locked --lib
      - name: Verify updater signatures and version binding
        run: python3 scripts/test-updater.py

  backends:
    # The dialect layer's unit tests cannot catch what actually broke here:
    # Postgres numbers placeholders $1.. and returns i32 for INTEGER. Only a
    # real server against a real database does, so all three run on every push.
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-only-password
          MYSQL_DATABASE: ferry
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pintegration-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: ferry
        ports: ["5432:5432"]
        options: >-
          --health-cmd=pg_isready --health-interval=10s
          --health-timeout=5s --health-retries=12
    env:
      # Without this a missing service would silently reduce the matrix to
      # SQLite and the job would still pass.
      FERRY_REQUIRE_ALL: "1"
      FERRY_TEST_MYSQL: mysql://root:integration-only-password@127.0.0.1:3306/ferry
      FERRY_TEST_POSTGRES: postgres://postgres:integration-only-password@127.0.0.1:5432/ferry
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: backends
      # rust-embed needs dist/ to exist, but these checks never load a page, so
      # build.rs's empty placeholder is enough and the npm build is skipped.
      - run: cargo build --locked -p ferry-server
      - run: ./scripts/test-backends.sh
      - name: CSV and XLSX import/export on all three databases
        env:
          MYSQL_PWD: integration-only-password
          PGPASSWORD: integration-only-password
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-venv"
          "$RUNNER_TEMP/transfer-venv/bin/pip" install openpyxl==3.1.5
          mysql -h 127.0.0.1 -u root -e 'CREATE DATABASE transfer_test;'
          createdb -h 127.0.0.1 -U postgres transfer_test
          "$RUNNER_TEMP/transfer-venv/bin/python" -I scripts/test-transfers.py
          FERRY_TEST_DATABASE_URL=mysql://root:integration-only-password@127.0.0.1:3306/transfer_test "$RUNNER_TEMP/transfer-venv/bin/python" -I scripts/test-transfers.py
          FERRY_TEST_DATABASE_URL=postgres://postgres:integration-only-password@127.0.0.1:5432/transfer_test "$RUNNER_TEMP/transfer-venv/bin/python" -I scripts/test-transfers.py
      - name: Platform initialization and authorization on all three databases
        env:
          MYSQL_PWD: integration-only-password
          PGPASSWORD: integration-only-password
        run: |
          mysql -h 127.0.0.1 -u root -e 'CREATE DATABASE platform_test;'
          createdb -h 127.0.0.1 -U postgres platform_test
          python3 -I scripts/test-platform.py
          FERRY_TEST_DATABASE_URL=mysql://root:integration-only-password@127.0.0.1:3306/platform_test python3 -I scripts/test-platform.py
          FERRY_TEST_DATABASE_URL=postgres://postgres:integration-only-password@127.0.0.1:5432/platform_test python3 -I scripts/test-platform.py
      - name: Workspace membership, roles and dashboard on all three databases
        env:
          MYSQL_PWD: integration-only-password
          PGPASSWORD: integration-only-password
        run: |
          mysql -h 127.0.0.1 -u root -e 'CREATE DATABASE workspace_test;'
          createdb -h 127.0.0.1 -U postgres workspace_test
          python3 -I scripts/test-workspace-admin.py
          FERRY_TEST_DATABASE_URL=mysql://root:integration-only-password@127.0.0.1:3306/workspace_test python3 -I scripts/test-workspace-admin.py
          FERRY_TEST_DATABASE_URL=postgres://postgres:integration-only-password@127.0.0.1:5432/workspace_test python3 -I scripts/test-workspace-admin.py
      - name: Template creation and authorization on all three databases
        env:
          MYSQL_PWD: integration-only-password
          PGPASSWORD: integration-only-password
        run: |
          mysql -h 127.0.0.1 -u root -e 'CREATE DATABASE template_test;'
          createdb -h 127.0.0.1 -U postgres template_test
          python3 -I scripts/test-templates.py
          FERRY_TEST_DATABASE_URL=mysql://root:integration-only-password@127.0.0.1:3306/template_test python3 -I scripts/test-templates.py
          FERRY_TEST_DATABASE_URL=postgres://postgres:integration-only-password@127.0.0.1:5432/template_test python3 -I scripts/test-templates.py
      - name: Workspace preferences and dictionaries on all three databases
        env:
          MYSQL_PWD: integration-only-password
          PGPASSWORD: integration-only-password
        run: |
          mysql -h 127.0.0.1 -u root -e 'CREATE DATABASE maintenance_test;'
          createdb -h 127.0.0.1 -U postgres maintenance_test
          python3 -I scripts/test-maintenance.py
          FERRY_TEST_DATABASE_URL=mysql://root:integration-only-password@127.0.0.1:3306/maintenance_test python3 -I scripts/test-maintenance.py
          FERRY_TEST_DATABASE_URL=postgres://postgres:integration-only-password@127.0.0.1:5432/maintenance_test python3 -I scripts/test-maintenance.py
      - name: Scheduled execution and graceful shutdown on all three databases
        env:
          MYSQL_PWD: integration-only-password
          PGPASSWORD: integration-only-password
        run: |
          cargo build --locked -p ferry-runner
          mysql -h 127.0.0.1 -u root -e 'CREATE DATABASE cron_test;'
          createdb -h 127.0.0.1 -U postgres cron_test
          python3 -I scripts/test-cron.py
          FERRY_TEST_DATABASE_URL=mysql://root:integration-only-password@127.0.0.1:3306/cron_test python3 -I scripts/test-cron.py
          FERRY_TEST_DATABASE_URL=postgres://postgres:integration-only-password@127.0.0.1:5432/cron_test python3 -I scripts/test-cron.py
      - name: Alert monitoring and Webhook delivery on all three databases
        env:
          MYSQL_PWD: integration-only-password
          PGPASSWORD: integration-only-password
        run: |
          mysql -h 127.0.0.1 -u root -e 'CREATE DATABASE alert_test;'
          createdb -h 127.0.0.1 -U postgres alert_test
          python3 -I scripts/test-alerts.py
          FERRY_TEST_DATABASE_URL=mysql://root:integration-only-password@127.0.0.1:3306/alert_test python3 -I scripts/test-alerts.py
          FERRY_TEST_DATABASE_URL=postgres://postgres:integration-only-password@127.0.0.1:5432/alert_test python3 -I scripts/test-alerts.py
      - name: External marketplace and repository authorization on all three databases
        env:
          MYSQL_PWD: integration-only-password
          PGPASSWORD: integration-only-password
        run: |
          mysql -h 127.0.0.1 -u root -e 'CREATE DATABASE marketplace_test; CREATE DATABASE oauth_test;'
          createdb -h 127.0.0.1 -U postgres marketplace_test
          createdb -h 127.0.0.1 -U postgres oauth_test
          python3 -I scripts/test-marketplace.py
          FERRY_TEST_DATABASE_URL=mysql://root:integration-only-password@127.0.0.1:3306/marketplace_test python3 -I scripts/test-marketplace.py
          FERRY_TEST_DATABASE_URL=postgres://postgres:integration-only-password@127.0.0.1:5432/marketplace_test python3 -I scripts/test-marketplace.py
          python3 -I scripts/test-repository-auth.py
          FERRY_TEST_DATABASE_URL=mysql://root:integration-only-password@127.0.0.1:3306/oauth_test python3 -I scripts/test-repository-auth.py
          FERRY_TEST_DATABASE_URL=postgres://postgres:integration-only-password@127.0.0.1:5432/oauth_test python3 -I scripts/test-repository-auth.py
      - name: Upgrade existing data from the previous prerelease on all three databases
        env:
          MYSQL_PWD: integration-only-password
          PGPASSWORD: integration-only-password
        run: |
          cp target/debug/ferry-server "$RUNNER_TEMP/new-server"
          git fetch origin tag v0.1.0-alpha.1 --depth=1
          mkdir -p "$RUNNER_TEMP/previous-source"
          git archive v0.1.0-alpha.1 | tar -x -C "$RUNNER_TEMP/previous-source"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --locked --manifest-path "$RUNNER_TEMP/previous-source/Cargo.toml" -p ferry-server
          cp target/debug/ferry-server "$RUNNER_TEMP/old-server"
          mysql -h 127.0.0.1 -u root -e 'CREATE DATABASE upgrade_test;'
          createdb -h 127.0.0.1 -U postgres upgrade_test
          python3 -I scripts/test-upgrade.py "$RUNNER_TEMP/old-server" "$RUNNER_TEMP/new-server"
          FERRY_TEST_DATABASE_URL=mysql://root:integration-only-password@127.0.0.1:3306/upgrade_test python3 -I scripts/test-upgrade.py "$RUNNER_TEMP/old-server" "$RUNNER_TEMP/new-server"
          FERRY_TEST_DATABASE_URL=postgres://postgres:integration-only-password@127.0.0.1:5432/upgrade_test python3 -I scripts/test-upgrade.py "$RUNNER_TEMP/old-server" "$RUNNER_TEMP/new-server"

  e2e:
    name: e2e-${{ matrix.harness }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        harness: [ssh, runner, pipelines, build-ui, deployments, deployments-docker, deployments-native, deployments-stack, deployments-groups, variables-ui]
    env:
      FERRY_REQUIRE_ALL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: workers/actions/go.mod
          cache-dependency-path: workers/actions/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-${{ matrix.harness }}
      - name: Install harness dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc lsof openssh-client python3 git curl libdigest-sha-perl
          docker info
      - uses: actions/setup-node@v4
        if: matrix.harness == 'build-ui' || startsWith(matrix.harness, 'deployments') || matrix.harness == 'variables-ui'
        with:
          node-version: "24"
          cache: npm
      - if: matrix.harness == 'build-ui' || startsWith(matrix.harness, 'deployments') || matrix.harness == 'variables-ui'
        run: npm ci
      - uses: actions/cache@v4
        if: matrix.harness == 'build-ui' || startsWith(matrix.harness, 'deployments') || matrix.harness == 'variables-ui'
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - if: matrix.harness == 'build-ui' || startsWith(matrix.harness, 'deployments') || matrix.harness == 'variables-ui'
        name: Install Chromium and system libraries
        run: |
          npx playwright install-deps chromium
          if [ "${{ steps.playwright.outputs.cache-hit }}" != true ]; then
            npx playwright install chromium
          fi
      - if: matrix.harness == 'build-ui' || startsWith(matrix.harness, 'deployments') || matrix.harness == 'variables-ui'
        run: npm run build
      - run: bash scripts/build-actions-workers.sh
      - run: cargo build --locked -p ferry-server -p ferry-runner
      - name: Platform initialization and management in Chromium
        if: matrix.harness == 'build-ui'
        run: node scripts/test-platform-ui.mjs
      - name: Workspace management browser acceptance
        if: matrix.harness == 'build-ui'
        run: node scripts/test-workspace-admin-ui.mjs
      - name: Import/export browser acceptance
        if: matrix.harness == 'build-ui'
        run: node scripts/test-transfers-ui.mjs
      - name: Template browser acceptance
        if: matrix.harness == 'build-ui'
        run: node scripts/test-templates-ui.mjs
      - name: Deployment form browser acceptance (three consecutive runs)
        if: matrix.harness == 'build-ui'
        run: |
          for round in 1 2 3; do
            echo "Deployment form acceptance round $round/3"
            node scripts/test-manifest-ui.mjs
          done
      - name: Preferences, dictionaries and heartbeat browser acceptance
        if: matrix.harness == 'build-ui'
        run: node scripts/test-maintenance-ui.mjs
      - name: Scheduled task browser acceptance
        if: matrix.harness == 'build-ui'
        run: node scripts/test-cron-ui.mjs
      - name: Alert rules and event browser acceptance
        if: matrix.harness == 'build-ui'
        run: node scripts/test-alerts-ui.mjs
      - name: Marketplace and browser repository authorization
        if: matrix.harness == 'build-ui'
        run: |
          trap 'echo "::error::Browser acceptance failed: $BASH_COMMAND"' ERR
          node scripts/test-marketplace-ui.mjs
          node scripts/test-repository-auth-ui.mjs
          node scripts/test-actions-ui.mjs
          node scripts/test-actions-canvas.mjs
          node scripts/test-manual-approval.mjs
          node scripts/test-named-connection-ui.mjs
          node scripts/test-runner-connection-ui.mjs
          node scripts/test-host-workspace-ui.mjs
          node scripts/test-table-layout-ui.mjs
      - name: Pipeline environments and classification acceptance
        if: matrix.harness == 'pipelines'
        run: python3 scripts/test-pipeline-classification.py
      - name: Three consecutive live runs (no retries)
        env:
          HARNESS: ${{ matrix.harness }}
        shell: bash
        run: |
          # SSH's strict flag is presence-based, even "0" would enable it.
          # Other jobs do not supply sshd coordinates to workspace unit tests.
          if [ "$HARNESS" = ssh ]; then export FERRY_REQUIRE_LIVE=1; fi
          case "$HARNESS" in
            pipelines) export FERRY_TEST_ACTIONS=1 ;;
            deployments-docker) export FERRY_TEST_DEPLOY_MODE=docker ;;
            deployments-native) export FERRY_TEST_DEPLOY_MODE=native ;;
            deployments-stack) export FERRY_TEST_DEPLOY_MODE=stack ;;
            deployments-groups) export FERRY_TEST_DEPLOY_MODE=native FERRY_TEST_GROUPS=1 ;;
          esac
          mkdir -p harness-logs
          echo '| Harness | Round | Result | Run ID | Commit |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- | --- | --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          for round in 1 2 3; do
            echo "::group::$HARNESS round $round/3"
            if [ "$HARNESS" = build-ui ] || [ "$HARNESS" = variables-ui ]; then
              command=(node "scripts/test-$HARNESS.mjs")
            elif [[ "$HARNESS" == deployments-* ]]; then
              command=(bash scripts/test-deployments.sh)
            else
              command=(bash "scripts/test-$HARNESS.sh")
            fi
            if "${command[@]}" 2>&1 | tee "harness-logs/round-$round.log"; then
              echo "| $HARNESS | $round/3 | PASS | $GITHUB_RUN_ID | $GITHUB_SHA |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $HARNESS | $round/3 | FAIL | $GITHUB_RUN_ID | $GITHUB_SHA |" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-${{ matrix.harness }}-${{ github.run_attempt }}
          path: harness-logs/*
          if-no-files-found: warn

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          # Built on the oldest supported image on purpose: the AppImage and the
          # .deb link against the runner's glibc, which sets the floor for the
          # distributions they install on.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: workers/actions/go.mod
          cache-dependency-path: workers/actions/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop -> target
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        name: Install the Tauri bundling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - run: npm ci
      # rust-embed compiles dist/ into the server binary, and the desktop app
      # ships that binary as its sidecar, so the real web build has to exist
      # before cargo runs — build.rs only creates an empty placeholder.
      - run: npm run build
      - name: Build the server and the runner
        run: cargo build --locked --release --target ${{ matrix.target }} -p ferry-server -p ferry-runner
      - name: Build bundled Actions workers
        shell: bash
        run: bash scripts/build-actions-workers.sh desktop/resources/actions-workers
      - name: Stage the sidecar Tauri bundles
        shell: bash
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; fi
          mkdir -p desktop/binaries
          cp "target/${{ matrix.target }}/release/ferry-server$exe" \
            "desktop/binaries/ferry-server-${{ matrix.target }}$exe"
      - name: Verify bundled service startup and lifecycle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; fi
          export DESKTOP_TEST_SERVER="$PWD/target/${{ matrix.target }}/release/ferry-server$exe"
          if [ "$RUNNER_OS" = Windows ]; then DESKTOP_TEST_SERVER="$(cygpath -w "$DESKTOP_TEST_SERVER")"; export DESKTOP_TEST_SERVER; fi
          cargo test --locked --manifest-path desktop/Cargo.toml --target ${{ matrix.target }} --lib server::tests -- --include-ignored
      # macOS uses ad-hoc code signing; updater payloads use the separate release key.
      - name: Build the desktop installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        shell: bash
        run: |
          # macOS DMG packaging shells out to hdiutil, which intermittently
          # fails to attach its scratch image on a GitHub runner. The app is
          # already built and signed by then, so the whole job goes red over a
          # transient mount. Retry rather than re-running the workflow by hand;
          # a real failure still fails three times and costs ~2 minutes.
          config_args=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            config_args=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          else
            test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::Missing updater signing key"; exit 1; }
          fi
          for attempt in 1 2 3; do
            if npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} "${config_args[@]}"; then
              exit 0
            fi
            echo "::warning::desktop bundling attempt $attempt failed"
            sleep 15
          done
          echo "::error::desktop bundling failed three times — not transient"
          exit 1
      - name: Verify Windows service lifecycle with the application manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Tauri embeds Common Controls v6 in the app, but its resource build
          # targets binaries only. Unit-test executables otherwise fail in the
          # Windows loader before main (TaskDialogIndirect, 0xc0000139).
          $target = '${{ matrix.target }}'
          $env:DESKTOP_TEST_SERVER = (Resolve-Path "target/$target/release/ferry-server.exe").Path
          $messages = & cargo test --locked --manifest-path desktop/Cargo.toml --target $target --lib --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { throw 'Test build failed' }
          $testExe = $messages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.executable } | Select-Object -ExpandProperty executable
          if (@($testExe).Count -ne 1) { throw 'Expected one library test executable' }
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/mt.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $mt) { throw 'Windows SDK manifest tool missing' }
          $appExe = (Resolve-Path "desktop/target/$target/release/ferry-desktop.exe").Path
          $manifest = Join-Path $env:RUNNER_TEMP 'desktop-test.manifest'
          & $mt '-nologo' "-inputresource:$appExe;#1" "-out:$manifest"
          if ($LASTEXITCODE -ne 0) { throw 'Extract application manifest failed' }
          & $mt '-nologo' '-manifest' $manifest "-outputresource:$testExe;#1"
          if ($LASTEXITCODE -ne 0) { throw 'Embed test manifest failed' }
          & $testExe 'server::tests' '--include-ignored'
          if ($LASTEXITCODE -ne 0) { throw 'Service lifecycle tests failed' }
      - name: Collect the release assets
        shell: bash
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; fi
          mkdir -p release-assets
          find "desktop/target/${{ matrix.target }}/release/bundle" -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*-setup.exe' \) \
            -exec cp {} release-assets/ \;
          # A silent miss here would publish a release with no installer for
          # this target, so fail while the bundle tree can still be inspected.
          test -n "$(ls -A release-assets)"
          # The server downloads these to enroll hosts, so they ship with the
          # installers rather than only inside the container image.
          cp "target/${{ matrix.target }}/release/ferry-runner$exe" \
            "release-assets/ferry-runner-${{ matrix.target }}$exe"
          # macOS archives have identical source names on both architectures.
          # Rename each archive AND its signature before merging the matrix artifacts.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "PR build: unsigned installers; no update manifest will be published."
          elif [ "$RUNNER_OS" = macOS ]; then
            archive=$(find "desktop/target/${{ matrix.target }}/release/bundle" -name '*.app.tar.gz' -type f)
            test -n "$archive"
            cp "$archive" "release-assets/updater-${{ matrix.target }}.app.tar.gz"
            cp "$archive.sig" "release-assets/updater-${{ matrix.target }}.app.tar.gz.sig"
          else
            find "desktop/target/${{ matrix.target }}/release/bundle" -type f               \( -name '*.AppImage.sig' -o -name '*.deb.sig' -o -name '*-setup.exe.sig' \) -exec cp {} release-assets/ \;
            test -n "$(find release-assets -name '*.sig')"
          fi
          ls -l release-assets
      - name: Verify Windows installation scopes and update path
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/test-windows-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  runner-linux-arm64:
    # The only release target with no desktop installer, built natively rather
    # than cross-compiled or emulated. Same image generation as the Linux
    # desktop job, so both runner binaries enroll hosts down to the same glibc.
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: runner-aarch64-unknown-linux-gnu
      # ferry-runner embeds nothing, so it needs no web build.
      - run: cargo build --locked --release -p ferry-runner
      - run: |
          mkdir -p release-assets
          cp target/release/ferry-runner release-assets/ferry-runner-aarch64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: dist-aarch64-unknown-linux-gnu
          path: release-assets/*
          if-no-files-found: error

  runner-services:
    uses: ./.github/workflows/runner-services.yml

  release:
    # Dispatch exercises the exact collection/checksum path without publishing.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [checks, backends, e2e, desktop, runner-linux-arm64, runner-services]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: dist-*
          merge-multiple: true
      - name: Generate signed updater manifest
        env:
          REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/updater-manifest.mjs release-assets "$(node -p 'require("./package.json").version')" "$REPOSITORY"
      - run: npm ci
      - name: Generate and sign runner update catalog
        env:
          REPOSITORY: ${{ github.repository }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          node .github/scripts/runner-manifest.mjs release-assets "$(node -p 'require("./package.json").version')" "$REPOSITORY"
          npm exec tauri signer sign -- release-assets/runner-update.json
          node .github/scripts/runner-manifest.mjs release-assets "$(node -p 'require("./package.json").version')" "$REPOSITORY" --verify
      - name: Checksum every asset
        working-directory: release-assets
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: release-dry-run
          path: release-assets/*
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          # A tag like v1.2.0-rc.1 is a pre-release; v1.2.0 is not.
          prerelease: ${{ contains(github.ref_name, '-') }}
