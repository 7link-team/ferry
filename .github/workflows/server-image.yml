name: Server container

on:
  # No paths filter on purpose: every commit on main gets a verified image, so
  # a tag can always be released by retagging the image its commit produced.
  push:
    branches: [main]
    tags: ["v*"]
  # A release created by GITHUB_TOKEN does not raise this event, so the tag push
  # above is what actually versions the image; this covers a hand-published one.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag to attach to an existing verified image (leave empty to build)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: (github.event_name == 'push' && github.ref_type == 'branch') || (github.event_name == 'workflow_dispatch' && !inputs.release_tag)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Dockerfile builds the web UI and runs `cargo test --locked` inside
      # the server stage, so this build is also the test gate for the image.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: ferry-server:check
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,scope=server-${{ matrix.arch }},mode=max
      - name: Verify initialization, the embedded web UI and a persistent restart
        run: node .github/scripts/smoke-server-image.mjs ferry-server:check
      - name: Push the verified architecture
        env:
          IMAGE: ghcr.io/${{ github.repository }}-server
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag ferry-server:check "$IMAGE:sha-$GITHUB_SHA-$ARCH"
          if ! docker push "$IMAGE:sha-$GITHUB_SHA-$ARCH" 2>&1 | tee push.log; then
            detail=$(tail -n 10 push.log | tr '\n' ' ')
            echo "::error::Registry push failed: $detail"
            exit 1
          fi

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge both verified architectures into one manifest list
        env:
          IMAGE: ghcr.io/${{ github.repository }}-server
        run: |
          docker buildx imagetools create --tag "$IMAGE:sha-$GITHUB_SHA" --tag "$IMAGE:latest" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" "$IMAGE:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:latest"

  version:
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}-server
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the verified image without rebuilding it
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          SOURCE_SHA=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          source="$IMAGE:sha-$SOURCE_SHA"
          # A tag pushed right after its commit arrives while that commit's
          # image is still being built and verified, so wait for it rather than
          # failing a release that is seconds early.
          for attempt in $(seq 1 30); do
            if docker buildx imagetools inspect "$source" --raw > source.json 2>/dev/null; then break; fi
            echo "waiting for $source ($attempt/30)"
            sleep 30
          done
          if [ ! -s source.json ]; then
            echo "No verified image for $SOURCE_SHA. Build one first:" >&2
            echo "  gh workflow run server-image.yml --ref $RELEASE_TAG" >&2
            exit 1
          fi
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' source.json
          if docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --raw > version.json 2> inspect-error.txt; then
            cmp source.json version.json || { echo "Refusing to overwrite a different version image" >&2; exit 1; }
          else
            grep -Eqi 'not found|manifest_unknown|manifest unknown' inspect-error.txt || { cat inspect-error.txt; exit 1; }
            docker buildx imagetools create --tag "$IMAGE:$RELEASE_TAG" "$source"
          fi
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --raw > version.json
          cmp source.json version.json
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG"
