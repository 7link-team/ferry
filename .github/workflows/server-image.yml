name: Server container

# Images are built only for version tags. The registry keeps only version
# images (vX.Y.Z) and `latest`, which points at the newest released version;
# commits on main never produce an image.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish, e.g. v0.4.0-alpha.1
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}-server

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      release: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve the release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ] && [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Not a version tag: $tag"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Dockerfile builds the web UI and runs `cargo test --locked` inside
      # the server stage, so this build is also the test gate for the image.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: ferry-server:check
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,scope=server-${{ matrix.arch }},mode=max
      - name: Verify initialization, the embedded web UI and a persistent restart
        run: node .github/scripts/smoke-server-image.mjs ferry-server:check
      # Push the verified image (same layers, from the build
      # cache) by digest, without any tag, so no scratch tags are left behind.
      - name: Push the verified architecture by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Record the pushed digest
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          [[ "$DIGEST" == sha256:* ]] || { echo "::error::No pushed digest"; exit 1; }
          mkdir -p digests && echo "$DIGEST" > "digests/$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.release }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the version and move latest to it
        shell: bash
        run: |
          amd64=$(cat digests/amd64); arm64=$(cat digests/arm64)
          # A published version is immutable: never repoint it to different content.
          if docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --raw > existing.json 2> inspect-error.txt; then
            echo "::error::$IMAGE:$RELEASE_TAG already exists; publish a new version instead"
            exit 1
          fi
          grep -Eqi 'not found|manifest_unknown|manifest unknown' inspect-error.txt || { cat inspect-error.txt; exit 1; }
          docker buildx imagetools create --tag "$IMAGE:$RELEASE_TAG" --tag "$IMAGE:latest" \
            "$IMAGE@$amd64" "$IMAGE@$arm64"
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --raw > version.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' version.json
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG"

  # Remove registry entries no version uses: commit images (sha-*), build
  # scratch tags and untagged leftovers. Entries referenced by a version or
  # latest (including their per-architecture images) are always kept.
  prune:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete versions without a release tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.repository.name }}-server
        run: |
          set -euo pipefail
          api="/orgs/$OWNER/packages/container/$PACKAGE/versions"
          gh api --paginate "$api?per_page=100" > versions.json
          jq -s 'add' versions.json > all.json
          # Keep every digest a version tag or latest points at, plus its children.
          : > keep.txt
          for tag in $(jq -r '.[].metadata.container.tags[] | select(test("^v[0-9]") or . == "latest")' all.json | sort -u); do
            raw=$(docker buildx imagetools inspect "$IMAGE:$tag" --raw)
            docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r '.digest' >> keep.txt
            echo "$raw" | jq -r '.manifests[]?.digest' >> keep.txt
          done
          sort -u keep.txt -o keep.txt
          kept=$(wc -l < keep.txt)
          [ "$kept" -gt 0 ] || { echo "::error::No release images found; refusing to prune"; exit 1; }
          jq -r --rawfile keep keep.txt '
            ($keep | split("\n") | map(select(length > 0))) as $k
            | .[]
            | select((.metadata.container.tags | any(test("^v[0-9]") or . == "latest")) | not)
            | select(.name as $d | $k | index($d) | not)
            | "\(.id) \(.name) \(.metadata.container.tags | join(","))"' all.json > delete.txt
          echo "Keeping $kept digests; deleting $(wc -l < delete.txt) versions"
          while read -r id digest tags; do
            echo "delete $digest ${tags:-<untagged>}"
            gh api -X DELETE "$api/$id" --silent
          done < delete.txt
