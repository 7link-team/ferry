name: Runner native services

on:
  workflow_call:
  push:
    branches: ["feat/**"]
    paths:
      - "crates/runner/**"
      - "crates/protocol/**"
      - "crates/server/src/runner.rs"
      - "crates/server/src/runner_updates.rs"
      - "crates/server/src/actions_run.rs"
      - "Cargo.lock"
      - "scripts/test-runner-service.py"
      - "scripts/test-runner-update.py"
      - "scripts/test-runner-upgrade.py"
      - ".github/scripts/*runner-manifest.mjs"
      - ".github/workflows/runner-services.yml"

permissions:
  contents: read

jobs:
  runner-services:
    name: Native runner service (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Windows service directory security preflight
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os, pathlib, subprocess, tempfile
          with tempfile.TemporaryDirectory(prefix='runner-acl-', dir=os.environ['ProgramFiles']) as root:
              env = dict(os.environ, RUNNER_SERVICE_STATE_DIRECTORY=root)
              env.pop('PSModulePath', None)
              subprocess.run(['powershell.exe', '-NoProfile', '-NonInteractive', '-Command', pathlib.Path('crates/runner/src/service/state-acl.ps1').read_text()], env=env, check=True)
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node --test .github/scripts/check-runner-manifest.mjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: runner-native-service
      - name: Build service and isolated API fixture
        run: cargo build --locked -p ferry-runner -p ferry-server
      - name: Runner tests
        run: cargo test --locked -p ferry-runner
      - name: Signed runner update verification
        run: python scripts/test-runner-update.py
      - name: Whole-task upgrade reservation tests
        run: |
          cargo test --locked -p ferry-server runner::tests
          cargo test --locked -p ferry-server runner_updates::tests
          cargo test --locked -p ferry-server actions_run::tests
      - name: Native system service lifecycle (Unix)
        if: runner.os != 'Windows'
        run: sudo env RUNNER_TEST_SYSTEM_SERVICE=1 python3 scripts/test-runner-service.py
      - name: Native system service lifecycle (Windows)
        if: runner.os == 'Windows'
        run: python scripts/test-runner-service.py
      - name: Signed service upgrade and rollback
        run: python scripts/test-runner-upgrade.py
