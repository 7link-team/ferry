name: Runner native services

on:
  workflow_call:
  push:
    branches: ["feat/**"]
    paths:
      - "crates/runner/**"
      - "crates/protocol/**"
      - "crates/server/src/hosts/**"
      - "scripts/runner-install.*"
      - "scripts/test-runner-install.py"
      - "scripts/test-runner-bootstrap.py"
      - "crates/server/src/pipelines/**"
      - "workers/actions/**"
      - "scripts/build-actions-workers.sh"
      - "scripts/test-actions-windows.py"
      - "Cargo.lock"
      - "scripts/test-runner-service.py"
      - "scripts/test-runner-update.py"
      - "scripts/test-runner-upgrade.py"
      - ".github/scripts/*runner-manifest.mjs"
      - ".github/workflows/runner-services.yml"

permissions:
  contents: read

jobs:
  runner-services:
    name: Native runner service (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Windows service directory security preflight
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os, pathlib, subprocess, tempfile
          with tempfile.TemporaryDirectory(prefix='runner-acl-', dir=os.environ['ProgramFiles']) as root:
              env = dict(os.environ, RUNNER_SERVICE_STATE_DIRECTORY=root)
              env.pop('PSModulePath', None)
              subprocess.run(['powershell.exe', '-NoProfile', '-NonInteractive', '-Command', pathlib.Path('crates/runner/src/service/state-acl.ps1').read_text()], env=env, check=True)
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Generated install commands (including native Windows PowerShell)
        run: npx vitest run src/features/hosts/RunnerConnection.test.tsx
      - run: node --test .github/scripts/check-runner-manifest.mjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: runner-native-service
      - name: Build service and isolated API fixture
        run: cargo build --locked -p ferry-runner -p ferry-server
      - name: Runner tests
        run: cargo test --locked -p ferry-runner
      - name: Signed runner update verification
        run: python scripts/test-runner-update.py
      - name: Runner and Actions regression tests
        shell: python
        run: |
          import subprocess
          for selection in ("hosts::runner::", "pipelines::actions_run::"):
              command = ["cargo", "test", "--locked", "-p", "ferry-server", selection]
              listing = subprocess.run(command + ["--", "--list"], check=True,
                                       stdout=subprocess.PIPE, text=True, encoding="utf-8")
              count = sum(line.endswith(": test") for line in listing.stdout.splitlines())
              if not count:
                  raise SystemExit(f"No tests selected by {selection}")
              print(f"Selected {count} tests for {selection}", flush=True)
              subprocess.run(command, check=True)
      - name: Native system service lifecycle (Unix)
        if: runner.os != 'Windows'
        run: sudo env RUNNER_TEST_SYSTEM_SERVICE=1 python3 scripts/test-runner-service.py
      - name: Native system service lifecycle (Windows)
        if: runner.os == 'Windows'
        run: python scripts/test-runner-service.py
      - name: Native current-user logon task lifecycle (Windows)
        if: runner.os == 'Windows'
        env:
          RUNNER_TEST_USER_SERVICE: "1"
        run: python scripts/test-runner-service.py
      - name: Bootstrap script rejection tests
        if: runner.os != 'Windows'
        run: python3 scripts/test-runner-install.py
      - name: Windows resumable bootstrap download tests
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-runner-download.ps1
      - name: One-command native service bootstrap (Unix)
        if: runner.os != 'Windows'
        run: sudo python3 scripts/test-runner-bootstrap.py
      - name: One-command native service bootstrap (Windows)
        if: runner.os == 'Windows'
        run: python scripts/test-runner-bootstrap.py
      - uses: actions/setup-go@v5
        if: runner.os != 'macOS'
        with:
          go-version-file: workers/actions/go.mod
          cache-dependency-path: workers/actions/go.sum
      - name: Actions pipelines on a Windows host
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ACTIONS_WORKER_TARGETS=windows/amd64 bash scripts/build-actions-workers.sh target/debug/actions-workers
          python scripts/test-actions-windows.py
          FERRY_TEST_EXECUTION_CAPACITY_ONLY=1 python scripts/test-actions-windows.py
      - name: Build Actions worker for whole-task upgrade acceptance
        if: runner.os == 'Linux'
        run: ACTIONS_WORKER_TARGETS=linux/amd64 bash scripts/build-actions-workers.sh
      - name: Signed service upgrade and rollback
        shell: bash
        env:
          RUNNER_TEST_ACTIONS: ${{ runner.os == 'Linux' && '1' || '' }}
        run: |
          mkdir -p harness-logs
          set +e
          python scripts/test-runner-upgrade.py 2>&1 | tee harness-logs/runner-upgrade.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python .github/scripts/annotate-failures.py harness-logs/runner-upgrade.log || true
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-upgrade-${{ matrix.os }}-${{ github.run_attempt }}
          path: harness-logs/runner-upgrade.log
          if-no-files-found: ignore

  # Independent of the service lifecycle above; run alongside it.
  actions-worker-windows:
    name: Actions worker tests (Windows host mode)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: workers/actions/go.mod
          cache-dependency-path: workers/actions/go.sum
      - working-directory: workers/actions
        shell: bash
        run: bash go.sh test ./...
