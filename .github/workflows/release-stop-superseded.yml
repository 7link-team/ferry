name: Stop superseded 0.3 release jobs
on:
  push:
    branches: [feat/release-030-stop-superseded]
    paths: [.github/workflows/release-stop-superseded.yml]
permissions:
  actions: write
  contents: read
jobs:
  stop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo=context.repo;
            for(const run_id of [42069831418,42069640434]) {
              const {data:run}=await github.rest.actions.getWorkflowRun({...repo,run_id});
              if(run.head_sha!=='449e1a0f948c882d32d520ad392a12f719f7dd83'||run.head_branch!=='main')throw Error('Unexpected superseded source');
              if(run.status==='completed'){core.info(`Already ended ${run_id}`);continue;}
              await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel',{...repo,run_id});
              core.notice(`Stopped superseded ${run_id}`);
            }
