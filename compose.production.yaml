# Combine with compose.postgres.yaml OR compose.mysql.yaml.
name: ${COMPOSE_PROJECT_NAME:-ferry}

x-service: &service
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  security_opt: ["no-new-privileges:true"]

services:
  ferry:
    <<: *service
    image: ${FERRY_IMAGE:?Run scripts/quickstart.sh first}
    ports: ["${FERRY_BIND_ADDRESS:-0.0.0.0}:${FERRY_PORT:-4290}:4290"]
    environment:
      FERRY_ALLOWED_HOSTS: ${FERRY_ALLOWED_HOSTS:?Run scripts/quickstart.sh first}
      FERRY_MASTER_KEY: ${FERRY_MASTER_KEY:?Required}
      FERRY_SECURE_COOKIE: ${FERRY_SECURE_COOKIE:-false}
      FERRY_TRUSTED_PROXIES: ${FERRY_TRUSTED_PROXIES:-}
      FERRY_NATS_URL: nats://ferry:${NATS_PASSWORD:?Required}@nats:4222
      FERRY_NATS_REPLICAS: "1"
      FERRY_CLUSTER_NAMESPACE: ${COMPOSE_PROJECT_NAME:-ferry}
      # Monitor the existing optional Redis profile; never used for SQL/NATS coordination.
      FERRY_REDIS_HOST: ${FERRY_REDIS_HOST:-redis}
      FERRY_REDIS_ENABLED: ${FERRY_REDIS:-false}
      FERRY_REDIS_PORT: ${FERRY_REDIS_PORT:-6379}
      FERRY_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      FERRY_REDIS_DB: ${FERRY_REDIS_DB:-0}
    depends_on:
      nats: { condition: service_healthy }
    volumes: ["./data/ferry:/data"]
    networks: [backend, egress]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:4290/api/status]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    stop_grace_period: 60s

  nats:
    <<: *service
    image: ${NATS_IMAGE:-nats:2.11-alpine}
    environment:
      NATS_PASSWORD: ${NATS_PASSWORD:?Required}
    command: ["--jetstream", "--store_dir", "/data", "--user", "ferry", "--pass", "${NATS_PASSWORD:?Required}", "--http_port", "8222"]
    volumes: ["./data/nats:/data"]
    networks: [backend]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional integrations service; visible in platform system monitoring.
  redis:
    <<: *service
    profiles: [redis]
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Required}
    command: [sh, -ec, 'exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"']
    volumes: ["./data/redis:/data"]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  backend: { internal: true }
  egress: {}
